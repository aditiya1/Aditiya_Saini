services:
  - type: web
    name: portfolio-chatbot-backend
    env: python
    pythonVersion: "3.11.7"
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && python initialize_knowledge_base.py
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://aditiya1.github.io,https://aditiya1.github.io/Aditiya_Saini
      - key: PORT
        value: 10000

